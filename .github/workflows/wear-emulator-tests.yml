name: Wear OS Emulator Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: wear-emu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api-level: 30, arch: x86, wear-version: "Wear OS 3" }
          - { api-level: 33, arch: x86_64, wear-version: "Wear OS 4" }
          - { api-level: 34, arch: x86_64, wear-version: "Wear OS 5" }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      # Required so /dev/kvm is accessible and the emulator boots with hardware
      # acceleration (without this the runner silently falls back to -accel off).
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -al /dev/kvm

      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run instrumentation suite + Robo-style crawl on ${{ matrix.wear-version }} (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: android-wear
          arch: ${{ matrix.arch }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: |
            adb logcat -c
            ./gradlew :app:connectedDebugAndroidTest
            GRADLE_EXIT=$?
            adb logcat -d > gradle-logcat.txt
            if [ $GRADLE_EXIT -ne 0 ]; then
              exit $GRADLE_EXIT
            fi

            echo "Running Monkey crawl (Robo-style automatic browsing)..."
            adb logcat -c
            adb shell monkey -p com.camerongineer.tipcalculatorwear --throttle 200 --pct-syskeys 0 --pct-appswitch 10 --ignore-timeouts --ignore-security-exceptions --monitor-native-crashes -v 1000 > monkey.log 2>&1 || true
            tail -5 monkey.log
            adb logcat -d > monkey-logcat.txt
            if grep -q "FATAL EXCEPTION" monkey-logcat.txt; then
              echo "::error::Monkey crawl found a crash — see monkey-logcat.txt"
              exit 1
            fi
            echo "Monkey crawl complete: no crashes found."

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: emulator-test-results-api-${{ matrix.api-level }}
          path: |
            **/connected/**/*.html
            gradle-logcat.txt
            monkey.log
            monkey-logcat.txt
          if-no-files-found: ignore

  # Aggregate gate so branch protection needs exactly one required context.
  wear-emulator-tests:
    needs: [emulator-suite]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if any matrix leg failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
      - name: All Wear OS matrix legs passed
        run: echo "Wear OS 3/4/5 emulator gates are green"
