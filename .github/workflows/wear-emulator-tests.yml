name: Wear OS 3 Emulator Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: wear-emu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wear-emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run instrumentation suite + Robo-style crawl on a Wear OS 3 (API 30) emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-wear
          arch: x86
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: |
            ./gradlew :app:connectedDebugAndroidTest

            echo "Running Monkey crawl (Robo-style automatic browsing)..."
            # Clear logcat so our crash check only sees crawl-era output
            adb logcat -c
            adb shell monkey -p com.camerongineer.tipcalculatorwear \
              --throttle 200 --pct-syskeys 0 --pct-appswitch 10 \
              --ignore-timeouts --ignore-security-exceptions --monitor-native-crashes \
              -v 1000 | tee monkey.log || true
            adb logcat -d > monkey-logcat.txt
            if grep -q "FATAL EXCEPTION" monkey-logcat.txt; then
              echo "::error::Monkey crawl found a crash — see monkey-logcat.txt"
              exit 1
            fi
            echo "Monkey crawl complete: no crashes found."

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: emulator-test-results
          path: |
            **/connected/**/*.html
            monkey.log
            monkey-logcat.txt
          if-no-files-found: ignore
