name: Firebase Test Lab (Wear)

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ftl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firebase-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build app and androidTest APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FTL_SERVICE_ACCOUNT_KEY }}
          project_id: tip-calculator-wear

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Ensure Test Lab API is enabled
        run: gcloud services enable testing.googleapis.com

      - name: Run instrumentation tests on the wearable device
        run: |
          set -euo pipefail
          CATALOG=$(gcloud firebase test android models list --format=json)
          echo "Wearables in catalog:"
          echo "$CATALOG" | jq -r '.[] | select(.formFactor=="WEARABLE") | "  \(.modelId) — \(.name) (versions: \(.supportedVersionIds | join(", ")))"'
          MODEL=$(echo "$CATALOG" | jq -r '[.[] | select(.formFactor=="WEARABLE")][0].modelId')
          VERSION=$(echo "$CATALOG" | jq -r '[.[] | select(.formFactor=="WEARABLE")][0].supportedVersionIds | map(tostring | tonumber) | max | tostring')
          echo "Using device: model=$MODEL version=$VERSION"
          gcloud firebase test android run \
            --type instrumentation \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device "model=$MODEL,version=$VERSION,locale=en_US,orientation=portrait" \
            --timeout 10m \
            --results-dir=gh-actions/pr-$GITHUB_RUN_ID
