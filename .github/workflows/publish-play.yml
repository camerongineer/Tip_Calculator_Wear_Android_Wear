name: Publish to Google Play

# Publishes to the internal testing track whenever a master push bumps
# versionCode in app/build.gradle.kts. Regular merges (no version bump) skip
# immediately. The upload only happens after the required CI and Wear OS
# Emulator Tests runs for the SAME commit are green — never publish unverified.

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: publish-play
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  PACKAGE: com.camerongineer.tipcalculatorwear

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Detect version bump on this push
        id: version
        run: |
          OLD_CODE=$(git show HEAD~1:app/build.gradle.kts 2>/dev/null | sed -n 's/^\s*versionCode = \([0-9]*\).*/\1/p')
          NEW_CODE=$(sed -n 's/^\s*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          NEW_NAME=$(sed -n 's/^\s*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          echo "versionCode ${OLD_CODE:-unset} -> $NEW_CODE (name $NEW_NAME)"
          echo "version_code=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$NEW_NAME" >> "$GITHUB_OUTPUT"
          if [ -n "$NEW_CODE" ] && [ "$NEW_CODE" -gt "${OLD_CODE:-0}" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for CI and Wear OS Emulator Tests to finish green
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # Required checks (branch protection): the run named CI, whose job is
          # build, and the run named Wear OS Emulator Tests (aggregate).
          # Poll until both completed runs for this exact commit succeeded.
          deadline=$(( $(date +%s) + 55*60 ))
          while true; do
            now=$(date +%s)
            if [ "$now" -gt "$deadline" ]; then
              echo "::error::Timed out waiting for CI / Wear OS Emulator Tests on $SHA"
              exit 1
            fi
            json=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=30")
            pending=false
            ok=true
            for required in "CI" "Wear OS Emulator Tests"; do
              result=$(echo "$json" | jq -r --arg n "$required" \
                '[.workflow_runs[] | select(.name == $n and .event == "push")][0] | "\(.status) \(.conclusion // "-")"' 2>/dev/null)
              status=${result%% *}
              conclusion=${result#* }
              echo "required check '$required': status=$status conclusion=$conclusion"
              if [ "$status" != "completed" ]; then pending=true;
              elif [ "$conclusion" != "success" ]; then ok=false; fi
            done
            if [ "$pending" = true ]; then
              echo "Waiting 30s for required checks on $SHA..."
              sleep 30
            elif [ "$ok" = true ]; then
              echo "All required checks green on $SHA - publishing."
              break
            else
              echo "::error::Refusing to publish: a required check failed on $SHA"
              exit 1
            fi
          done

      - name: Set up JDK 21
        if: steps.version.outputs.should_release == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.version.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Decode signing keystore
        if: steps.version.outputs.should_release == 'true'
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PLAY_KEYSTORE_BASE64" ]; then
            echo "::error::PLAY_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$PLAY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keys.jks"

      - name: Build signed release bundle
        if: steps.version.outputs.should_release == 'true'
        # Gradle reads the CI_KEYSTORE_* env vars itself via SigningConfig ciPlay.
        env:
          CI_KEYSTORE_FILE: ${{ runner.temp }}/keys.jks
          CI_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          CI_KEYSTORE_ALIAS: ${{ secrets.PLAY_KEYSTORE_ALIAS }}
          CI_KEYSTORE_KEY_PASSWORD: ${{ secrets.PLAY_KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Upload to Google Play (internal testing)
        if: steps.version.outputs.should_release == 'true'
        uses: r0adkll/upload-google-play@v1.1.1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE }}
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          releaseName: ${{ steps.version.outputs.version_name }}
          status: completed
          mappingFiles: app/build/outputs/mapping/release/mapping.txt
